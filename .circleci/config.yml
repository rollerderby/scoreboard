version: 2.1
jobs:
  build:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      - run: sudo apt update && sudo apt -y install ant junit4
      - run: ant
  compat:
    docker:
      - image: cimg/node:24.18.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-dependencies-v1-{{ checksum "package-lock.json" }}
            - npm-dependencies-v1-
      - run: npm ci
      - save_cache:
          key: npm-dependencies-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm run compat
workflows:
  checks:
    jobs:
      - build
      - compat
