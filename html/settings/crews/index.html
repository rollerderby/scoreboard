<!doctype html>
<html>
  <head>
    <title sbDisplay="ScoreBoard.OfficialsCrew([crew]).Name: toTitle">Edit Team | CRG ScoreBoard</title>

    <script type="text/javascript" src="/external/jquery/jquery.js"></script>
    <script type="text/javascript" src="/json/core.js"></script>
  </head>
  <body>
    <a id="sbIndexLink" href="/settings/sb_data/">Back to overview page</a>
    <div id="main" class="ui-widget sbSegment" sbContext="ScoreBoard.OfficialsCrew([crew])" style="width: 100%">
      <div class="sbGroup">Name: <input type="text" width="50" sbControl="Name" /></div>
      <table class="sbGroup Officials" officialType="Nso">
        <col class="Role" />
        <col class="Name" />
        <col class="League" />
        <col class="Cert" />
        <col class="Store" />
        <col class="Button" />
        <thead>
          <tr class="sbHeader">
            <th colspan="2" class="Title">Non Skating Officials</th>
            <th class="Head">
              Head:
              <select class="Head" sbControl="HNSO">
                <option value="">Not Set</option>
                <option sbForeach="Nso:: name: resort=Name" sbAttr="name: Name | value: Id" sbDisplay="Name"></option>
              </select>
            </th>
            <th></th>
            <th></th>
            <th></th>
          </tr>
          <tr class="sbSubHeader">
            <th>Role</th>
            <th>Name</th>
            <th>League</th>
            <th>Cert Level</th>
            <th></th>
            <th></th>
          </tr>
          <tr class="AddOfficial sbSubHeader">
            <th rowspan="2">
              <span class="Role">
                <select class="Role" sbCall="toggleInput">
                  <option value="">None Selected</option>
                  <option value="Head Non-Skating Official">Head Non-Skating Official</option>
                  <option value="Penalty Lineup Tracker">Penalty Lineup Tracker</option>
                  <option value="Penalty Tracker">Penalty Tracker</option>
                  <option value="Penalty Wrangler">Penalty Wrangler</option>
                  <option value="Inside Whiteboard Operator">Inside Whiteboard Operator</option>
                  <option value="Jam Timer">Jam Timer</option>
                  <option value="Scorekeeper">Scorekeeper</option>
                  <option value="ScoreBoard Operator">ScoreBoard Operator</option>
                  <option value="Penalty Box Manager">Penalty Box Manager</option>
                  <option value="Penalty Box Timer">Penalty Box Timer</option>
                  <option value="Lineup Tracker">Lineup Tracker</option>
                  <option value="Non-Skating Official Alternate">Non-Skating Official Alternate</option>
                  <option value="O">Other</option>
                </select>
                <input type="text" size="20" class="Role sbHide" sbOn="paste: igrfPasteOfficials" />
              </span>
            </th>
            <th><input type="text" size="30" class="Name" sbOn="keyup: updateAddButton | paste: pasteOfficials" /></th>
            <th><input type="text" size="30" class="League" sbOn="keyup: updateAddButton | paste: pasteOfficials" /></th>
            <th><input type="text" size="10" class="Cert" sbOn="keyup: updateAddButton | paste: pasteOfficials" /></th>
            <th></th>
            <th rowspan="2"><button disabled class="AddOfficial ui-button-disabled ui-state-disabled" sbCall="addOfficial">Add</button></th>
          </tr>
          <tr class="AddPreparedOfficial sbSubHeader">
            <th colspan="2">
              <select class="Prepared" sbOn="change: updateAddButton">
                <option value="">Select Stored Official</option>
                <option
                  sbContext="/ScoreBoard"
                  sbForeach="PreparedOfficial::info"
                  sbAttr="value: Id | info: FullInfo"
                  sbDisplay="FullInfo"
                  sbCall="updateAddButton"
                ></option>
              </select>
            </th>
            <th colspan="3"></th>
          </tr>
        </thead>
        <tbody>
          <tr sbForeach="Nso:: role: resort=Role" sbAttr="role: Role | name: Name" class="Official">
            <td class="Role">
              <span class="Role">
                <select class="Role" sbControl="Role: filterOtherRole: otherToEmpty">
                  <option value="">None Selected</option>
                  <option value="Head Non-Skating Official">Head Non-Skating Official</option>
                  <option value="Penalty Lineup Tracker">Penalty Lineup Tracker</option>
                  <option value="Penalty Tracker">Penalty Tracker</option>
                  <option value="Penalty Wrangler">Penalty Wrangler</option>
                  <option value="Inside Whiteboard Operator">Inside Whiteboard Operator</option>
                  <option value="Jam Timer">Jam Timer</option>
                  <option value="Scorekeeper">Scorekeeper</option>
                  <option value="ScoreBoard Operator">ScoreBoard Operator</option>
                  <option value="Penalty Box Manager">Penalty Box Manager</option>
                  <option value="Penalty Box Timer">Penalty Box Timer</option>
                  <option value="Lineup Tracker">Lineup Tracker</option>
                  <option value="Non-Skating Official Alternate">Non-Skating Official Alternate</option>
                  <option value="O">Other</option>
                </select>
                <input type="text" size="20" class="Role sbHide" sbClass="sbHide: Role: notOtherRole" sbControl="Role" />
              </span>
            </td>
            <td colspan="2" class="Prepared"><span sbDisplay="Name"></span> (<span sbDisplay="League"></span> - <span sbDisplay="Cert"></span>)</td>
            <td colspan="2"></td>
            <td class="Remove"><button class="RemoveOfficial" sbCall="openRemoveDialog">Remove</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>

<div class="sbTemplates">
  <div id="RefRoles">
    <option value="">None Selected</option>
    <option value="Head Referee">Head Referee</option>
    <option value="Inside Pack Referee">Inside Pack Referee</option>
    <option value="Jammer Referee">Jammer Referee</option>
    <option value="Outside Pack Referee">Outside Pack Referee</option>
    <option value="Referee Alternate">Referee Alternate</option>
    <option value="O">Other</option>
  </div>

  <div id="OfficialRemoveDialog" sbContext="NSO(*)" class="sbSegment">
    <div class="sbGroup">
      <div>
        <span class="Title">Officials</span><br />
        <span class="Remove">Remove Official: </span>
        <span class="Target" sbDisplay="Name"></span><br />
        <span class="Role">(Role: <span sbDisplay="Role"></span>)</span>
      </div>
    </div>
    <div class="sbGroup">
      <span class="AreYouSure">Are you sure?</span>
    </div>
  </div>
</div>
